<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=yes"
        />
        <title>QR Code AR Marker - Tebal & Minim</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                font-family: "Inter", system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 1.5rem;
            }

            .container {
                background: white;
                border-radius: 2rem;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 2rem;
                padding: 1.5rem;
                max-width: 1400px;
                width: 100%;
                height: calc(100vh - 3rem);
                max-height: 90vh;
            }

            .panel {
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            .left-panel {
                border-right: 2px solid #f0f0f0;
                padding-right: 1.5rem;
                overflow-y: auto;
                max-height: calc(100vh - 6rem);
            }

            h1 {
                font-size: 1.5rem;
                color: #1a1a1a;
                margin-bottom: 0.3rem;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .subtitle {
                color: #666;
                font-size: 0.8rem;
                margin-bottom: 1rem;
                border-left: 4px solid #667eea;
                padding-left: 0.8rem;
            }

            label {
                font-weight: 700;
                color: #1a1a1a;
                font-size: 0.85rem;
                display: block;
                margin-bottom: 0.3rem;
            }

            input[type="text"],
            input[type="url"],
            textarea,
            select {
                width: 100%;
                padding: 0.6rem 0.8rem;
                border: 2px solid #e0e0e0;
                border-radius: 0.6rem;
                font-family: inherit;
                font-size: 0.85rem;
                background: #fafafa;
                transition: all 0.3s;
            }

            input[type="text"]:focus,
            input[type="url"]:focus,
            textarea:focus,
            select:focus {
                outline: none;
                border-color: #667eea;
                background: white;
                box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            }

            textarea {
                resize: vertical;
                min-height: 60px;
                font-size: 0.85rem;
            }

            .input-group {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }

            .input-group > div {
                flex: 1;
                min-width: 150px;
            }

            .checkbox-group {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.8rem;
                background: #f8f9fa;
                border-radius: 0.6rem;
                border: 1px solid #e9ecef;
            }

            input[type="checkbox"] {
                width: 20px;
                height: 20px;
                cursor: pointer;
                accent-color: #667eea;
            }

            .checkbox-group label {
                margin: 0;
                font-weight: 500;
                color: #333;
                cursor: pointer;
            }

            .button-group {
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 120px;
                padding: 0.7rem 1.2rem;
                border: none;
                border-radius: 0.8rem;
                font-weight: 700;
                font-size: 0.85rem;
                cursor: pointer;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
            }

            .btn-primary {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
            }

            .btn-secondary {
                background: white;
                color: #667eea;
                border: 2px solid #667eea;
            }

            .btn-secondary:hover {
                background: #f0f0f0;
            }

            .btn-tertiary {
                background: #f0f0f0;
                color: #333;
                border: 1px solid #ddd;
            }

            .btn-tertiary:hover {
                background: #e0e0e0;
            }

            .divider {
                height: 1px;
                background: #e0e0e0;
                margin: 1rem 0;
            }

            .right-panel {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 0;
            }

            .preview-box {
                background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
                border: 2px dashed #667eea;
                border-radius: 1rem;
                padding: 1rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                position: relative;
                min-height: 300px;
            }

            .canvas-wrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                background: white;
                border-radius: 0.8rem;
                padding: 0.5rem;
                box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
                width: 100%;
                height: 100%;
                max-width: 400px;
                max-height: 400px;
                overflow: auto;
            }

            canvas {
                display: block;
                max-width: 100%;
                max-height: 100%;
                height: auto;
                width: auto;
                image-rendering: crisp-edges;
            }

            #qrContainer {
                max-width: 100%;
                max-height: 100%;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #qrContainer canvas {
                max-width: 100%;
                max-height: 100%;
            }

            .preview-info {
                margin-top: 0.8rem;
                text-align: center;
                font-size: 0.75rem;
                color: #666;
            }

            .info-badge {
                display: inline-block;
                background: #f0f0f0;
                padding: 0.35rem 0.8rem;
                border-radius: 2rem;
                margin: 0.2rem;
                font-size: 0.7rem;
                color: #333;
            }

            .success-message {
                background: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
                padding: 1rem;
                border-radius: 0.8rem;
                margin-bottom: 1rem;
                display: none;
            }

            .error-message {
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
                padding: 1rem;
                border-radius: 0.8rem;
                margin-bottom: 1rem;
                display: none;
            }

            @media (max-width: 1024px) {
                .container {
                    grid-template-columns: 1fr;
                    gap: 1rem;
                    height: auto;
                    max-height: none;
                }

                .left-panel {
                    border-right: none;
                    border-bottom: 2px solid #f0f0f0;
                    padding-right: 0;
                    padding-bottom: 1.5rem;
                    max-height: none;
                }

                .right-panel {
                    min-height: 350px;
                }

                .preview-box {
                    min-height: 350px;
                }

                .canvas-wrapper {
                    max-width: 320px;
                    max-height: 320px;
                }
            }

            @media (max-width: 600px) {
                h1 {
                    font-size: 1.2rem;
                }

                .container {
                    padding: 1rem;
                    gap: 1rem;
                }

                button {
                    min-width: 100px;
                    padding: 0.6rem 1rem;
                    font-size: 0.8rem;
                }

                .preview-box {
                    min-height: 280px;
                }

                .canvas-wrapper {
                    max-width: 260px;
                    max-height: 260px;
                }

                .left-panel {
                    max-height: none;
                }

                .right-panel {
                    min-height: 300px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <!-- Left Panel: Controls -->
            <div class="panel left-panel">
                <h1>🎯 QR AR Marker</h1>
                <div class="subtitle">
                    QR Code tebal & minim untuk AR + Web Link
                </div>

                <div class="success-message" id="successMsg"></div>
                <div class="error-message" id="errorMsg"></div>

                <!-- Web Link Input -->
                <div>
                    <label>🌐 URL Website Anda</label>
                    <input
                        type="url"
                        id="webLink"
                        placeholder="https://example.com"
                        value="https://example.com"
                    />
                    <small style="color: #999; margin-top: 0.3rem; display: block"
                        >Link akan di-encode dalam QR Code</small
                    >
                </div>

                <!-- AR Marker ID -->
                <div>
                    <label>📍 ID AR Marker (Opsional)</label>
                    <input
                        type="text"
                        id="arMarkerID"
                        placeholder="marker-001"
                        value="marker-001"
                    />
                    <small style="color: #999; margin-top: 0.3rem; display: block"
                        >Identitas unik untuk tracking AR</small
                    >
                </div>

                <!-- QR Design Settings -->
                <div>
                    <label>⚙️ Pengaturan Desain</label>
                    <div class="input-group">
                        <div>
                            <label style="font-size: 0.85rem; margin-bottom: 0.3rem"
                                >Ukuran Module</label
                            >
                            <select id="moduleSize">
                                <option value="4">4px (Kecil)</option>
                                <option value="6">6px</option>
                                <option value="8" selected>8px (Rekomendasi)</option>
                                <option value="10">10px</option>
                                <option value="12">12px (Besar)</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.85rem; margin-bottom: 0.3rem"
                                >Gaya Marker</label
                            >
                            <select id="markerStyle">
                                <option value="solid" selected>Solid (Tebal)</option>
                                <option value="outline">Garis</option>
                                <option value="circle">Lingkaran</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Warna Settings -->
                <div class="input-group">
                    <div>
                        <label>🎨 Warna Modul</label>
                        <input type="color" id="moduleColor" value="#000000" />
                    </div>
                    <div>
                        <label>🖼️ Warna Background</label>
                        <input type="color" id="bgColor" value="#ffffff" />
                    </div>
                </div>

                <div class="divider"></div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button class="btn-primary" id="generateBtn">
                        <span>⚡</span> Generate QR
                    </button>
                </div>

                <div class="button-group">
                    <button class="btn-tertiary" id="downloadPngBtn">
                        <span>🖼️</span> Unduh PNG
                    </button>
                    <button class="btn-tertiary" id="printBtn">
                        <span>🖨️</span> Cetak
                    </button>
                </div>

                <div style="margin-top: 0.8rem; padding: 0.8rem; background: #f8f9fa; border-radius: 0.6rem; font-size: 0.7rem; color: #666; border-left: 4px solid #667eea; line-height: 1.4;">
                    <strong style="font-size: 0.75rem;">💡 Tips Cetak:</strong><br>
                    • Min 4cm x 4cm<br>
                    • 300 DPI untuk hasil terbaik<br>
                    • Kontras tinggi (hitam/putih)<br>
                    • Solid style untuk jarak jauh
                </div>
            </div>

            <!-- Right Panel: Preview -->
            <div class="panel right-panel">
                <div class="preview-box">
                    <div class="canvas-wrapper">
                        <div id="qrContainer"></div>
                    </div>
                </div>
                <div class="preview-info" id="previewInfo">
                    Silakan klik "Generate QR" untuk membuat QR Code
                </div>
            </div>
        </div>

        <script>
            (function () {
                // DOM Elements
                const webLinkInput = document.getElementById("webLink");
                const arMarkerIDInput = document.getElementById("arMarkerID");
                const moduleSizeSelect = document.getElementById("moduleSize");
                const markerStyleSelect = document.getElementById("markerStyle");
                const moduleColorInput = document.getElementById("moduleColor");
                const bgColorInput = document.getElementById("bgColor");
                const generateBtn = document.getElementById("generateBtn");
                const downloadPngBtn = document.getElementById("downloadPngBtn");
                const printBtn = document.getElementById("printBtn");
                const qrContainer = document.getElementById("qrContainer");
                const previewInfo = document.getElementById("previewInfo");
                const successMsg = document.getElementById("successMsg");
                const errorMsg = document.getElementById("errorMsg");

                let currentQR = null;
                let currentQRData = null;

                // Show message
                function showMessage(type, message) {
                    const msgEl = type === "success" ? successMsg : errorMsg;
                    msgEl.textContent = message;
                    msgEl.style.display = "block";
                    setTimeout(() => {
                        msgEl.style.display = "none";
                    }, 4000);
                }

                // Generate QR Code
                function generateQR() {
                    const webLink = webLinkInput.value.trim();
                    const arID = arMarkerIDInput.value.trim();

                    if (!webLink) {
                        showMessage("error", "URL tidak boleh kosong");
                        return;
                    }

                    try {
                        // Encode text
                        const qrText = arID ? `${webLink}|${arID}` : webLink;
                        const moduleSize = parseInt(moduleSizeSelect.value);
                        const markerStyle = markerStyleSelect.value;
                        const moduleColor = moduleColorInput.value;
                        const bgColor = bgColorInput.value;

                        // Calculate responsive size (max 380px to fit in container)
                        const maxSize = 380;
                        const qrSize = Math.min(moduleSize * 100, maxSize);

                        // Clear previous QR
                        qrContainer.innerHTML = "";

                        // Generate QR with QRCode.js library
                        currentQR = new QRCode(qrContainer, {
                            text: qrText,
                            width: qrSize,
                            height: qrSize,
                            colorDark: moduleColor,
                            colorLight: bgColor,
                            correctLevel: QRCode.CorrectLevel.H
                        });

                        // Get canvas and apply styling
                        const canvas = qrContainer.querySelector("canvas");
                        if (canvas) {
                            // Make canvas responsive
                            canvas.style.maxWidth = "100%";
                            canvas.style.height = "auto";
                            canvas.style.imageRendering = "crisp-edges";
                            canvas.style.display = "block";
                        }

                        currentQRData = {
                            text: qrText,
                            webLink: webLink,
                            arID: arID,
                            moduleSize: moduleSize,
                            style: markerStyle,
                            moduleColor: moduleColor,
                            bgColor: bgColor
                        };

                        previewInfo.innerHTML = `
                            <div>
                                <span class="info-badge">Size: ${moduleSize}px</span>
                                <span class="info-badge">Style: ${markerStyle}</span>
                                <span class="info-badge">Kontras: Tinggi</span>
                            </div>
                            <div style="margin-top: 0.5rem; font-size: 0.75rem">
                                ✅ QR Code siap untuk cetak & AR scanning
                            </div>
                        `;

                        showMessage("success", "QR Code berhasil dibuat!");
                    } catch (err) {
                        showMessage("error", "Error: " + err.message);
                        console.error(err);
                    }
                }

                // Download PNG
                function downloadPNG() {
                    if (!currentQR) {
                        showMessage("error", "Generate QR Code terlebih dahulu");
                        return;
                    }

                    const canvas = qrContainer.querySelector("canvas");
                    if (!canvas) {
                        showMessage("error", "Canvas tidak ditemukan");
                        return;
                    }

                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = `qr-ar-marker-${new Date().getTime()}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        showMessage("success", "QR Code berhasil diunduh!");
                    }, "image/png", 1.0);
                }

                // Print
                function print() {
                    if (!currentQR) {
                        showMessage("error", "Generate QR Code terlebih dahulu");
                        return;
                    }

                    const canvas = qrContainer.querySelector("canvas");
                    if (!canvas) {
                        showMessage("error", "Canvas tidak ditemukan");
                        return;
                    }

                    const printWindow = window.open("", "", "height=600,width=800");
                    const html = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <title>Cetak QR Code AR Marker</title>
                            <style>
                                body { margin: 0; padding: 1cm; text-align: center; font-family: Arial; }
                                img { max-width: 15cm; height: auto; margin: 2cm 0; display: block; margin-left: auto; margin-right: auto; }
                                h2 { margin: 0; color: #333; }
                                p { margin: 0.5cm 0; color: #666; font-size: 12px; }
                                @media print {
                                    body { margin: 0; padding: 1cm; }
                                    img { max-width: 100%; }
                                }
                            </style>
                        </head>
                        <body>
                            <h2>🎯 QR Code AR Marker</h2>
                            <p><strong>Web Link:</strong> ${currentQRData.webLink}</p>
                            <p><strong>AR ID:</strong> ${currentQRData.arID || "N/A"}</p>
                            <img src="${canvas.toDataURL("image/png")}" />
                            <p style="font-size: 10px; margin-top: 2cm;">
                                Generated: ${new Date().toLocaleString()}<br>
                                Module Size: ${currentQRData.moduleSize}px<br>
                                Style: ${currentQRData.style}
                            </p>
                        </body>
                        </html>
                    `;
                    printWindow.document.write(html);
                    printWindow.document.close();
                    setTimeout(() => {
                        printWindow.print();
                    }, 250);
                }

                // Event Listeners
                generateBtn.addEventListener("click", generateQR);
                downloadPngBtn.addEventListener("click", downloadPNG);
                printBtn.addEventListener("click", print);

                // Auto-generate on load
                window.addEventListener("load", () => {
                    generateQR();
                });
            })();
        </script>
    </body>
</html>
